<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>deploy-kit: one deploy in eight steps, and the symlink swap on the server</title>
  <rect width="1200" height="560" rx="18" fill="#faf9f5"/>
  <text x="40" y="58" font-size="26" font-weight="600" fill="#141413">One deploy, eight steps</text>
  <text x="40" y="86" font-size="15" fill="#5e5d59">deploy.sh runs on your machine or in CI; remote.sh runs on the server. Nothing live changes before step 4.</text>

  <g font-size="13">
    <g transform="translate(40 112)">
      <rect width="262" height="118" rx="12" fill="#ffffff" stroke="#dedcd1"/>
      <text x="16" y="28" font-size="12" fill="#87867f" font-family="ui-monospace, Consolas, monospace">deploy.sh · client</text>
      <text x="16" y="54" font-weight="600" fill="#141413">1 Stage</text><text x="86" y="54" fill="#30302e">dist/ + version.txt = commit</text>
      <text x="16" y="78" font-weight="600" fill="#141413">↑ Upload</text><text x="86" y="78" fill="#30302e">tar over ssh into new/</text>
      <text x="16" y="102" font-weight="600" fill="#141413">8 Check</text><text x="86" y="102" fill="#30302e">poll /version.txt = commit</text>
    </g>
    <path d="M310 171 H352" stroke="#141413" stroke-width="2" marker-end="url(#a)"/>
    <g transform="translate(360 112)">
      <rect width="800" height="118" rx="12" fill="#ffffff" stroke="#dedcd1"/>
      <text x="16" y="28" font-size="12" fill="#87867f" font-family="ui-monospace, Consolas, monospace">remote.sh · server</text>
      <g transform="translate(16 44)">
        <rect width="178" height="58" rx="9" fill="#f5f4ed"/><text x="12" y="24" font-weight="600" fill="#141413">2 Validate</text><text x="12" y="44" fill="#5e5d59">caddy validate, no network</text>
        <rect x="192" width="178" height="58" rx="9" fill="#f5f4ed"/><text x="204" y="24" font-weight="600" fill="#141413">3 Unpack</text><text x="204" y="44" fill="#5e5d59">releases/&lt;sha12&gt;-&lt;UTC&gt;</text>
        <rect x="384" width="178" height="58" rx="9" fill="#141413"/><text x="396" y="24" font-weight="600" fill="#faf9f5">4 Swap + 5 Config</text><text x="396" y="44" fill="#d1cfc5">one rename(2) each</text>
        <rect x="576" width="192" height="58" rx="9" fill="#f5f4ed"/><text x="588" y="24" font-weight="600" fill="#141413">6 Reload · 7 Prune</text><text x="588" y="44" fill="#5e5d59">caddy reload, keep 3</text>
      </g>
    </g>
  </g>

  <text x="40" y="282" font-size="20" font-weight="600" fill="#141413">Step 4: the swap every request survives</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14">
    <g transform="translate(40 304)">
      <rect width="520" height="212" rx="12" fill="#ffffff" stroke="#dedcd1"/>
      <text x="20" y="32" fill="#87867f">/srv/sites/example/www</text>
      <text x="20" y="64" fill="#141413">releases/</text>
      <text x="44" y="92" fill="#5e5d59">a1b2c3d4e5f6-20261116T091204Z</text>
      <text x="44" y="120" fill="#5e5d59">0f9e8d7c6b5a-20261117T054011Z</text>
      <text x="44" y="148" fill="#141413" font-weight="600">9c8b7a6d5e4f-20261117T113052Z</text>
      <text x="20" y="180" fill="#141413">current</text><text x="98" y="180" fill="#2969FF">→ releases/9c8b7a6d5e4f-…</text>
    </g>
    <g transform="translate(600 304)">
      <rect width="560" height="212" rx="12" fill="#141413"/>
      <text x="22" y="40" fill="#87867f"># not atomic: unlink, then create</text>
      <text x="22" y="66" fill="#d1cfc5" text-decoration="line-through">ln -sfn releases/new www/current</text>
      <text x="22" y="108" fill="#87867f"># atomic: build a second link, rename it over</text>
      <text x="22" y="134" fill="#faf9f5">ln -sfn releases/new www/current.next</text>
      <text x="22" y="158" fill="#faf9f5">mv -T www/current.next www/current</text>
      <text x="22" y="192" fill="#9cc58a"># every request sees old or new, never neither</text>
    </g>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker></defs>
</svg>
